name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Typecheck, build and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (app, API and tests)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check room answers aren't in the bundle
        run: |
          if grep -E "7Q4M|LUMEN|VAULT-0412|OVR-88-KILO|REF-101-NEG" dist/assets/*.js; then
            echo "A room answer leaked into the client bundle"; exit 1
          fi

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (UI, API, accessibility)
        run: npm test

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
